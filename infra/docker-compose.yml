networks:
  organizer-net:
    driver: bridge

volumes:
  doc-storage:
    name: organizer-doc-storage
  sql-data:
    name: organizer-sql-data
  rabbitmq-data:
    name: organizer-rabbitmq-data

services:
  sqlserver:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest}
    container_name: organizer-sql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - organizer-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: organizer-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-organizer}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-organizer_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - organizer-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: organizer-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # Web UI
      - "4317:4317"                       # OTLP gRPC receiver
      - "4318:4318"                       # OTLP HTTP receiver
    networks:
      - organizer-net

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.app
    container_name: organizer-app
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-5050}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OrganizerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-organizer}
      - RabbitMQ__Password=${RABBITMQ_PASS:-organizer_secret}
      - Storage__RootPath=/storage
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    volumes:
      - doc-storage:/storage
    networks:
      - organizer-net

  processing:
    build:
      context: ..
      dockerfile: infra/Dockerfile.processing
    container_name: organizer-processing
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PROCESSING_HOST_PORT:-5051}:8080"
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-organizer}
      - RabbitMQ__Password=${RABBITMQ_PASS:-organizer_secret}
      - Storage__RootPath=/storage
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    volumes:
      - doc-storage:/storage
    networks:
      - organizer-net
